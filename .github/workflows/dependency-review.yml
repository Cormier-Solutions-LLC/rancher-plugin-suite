name: Dependency review

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: cormier-runners
    timeout-minutes: 10
    steps:
      # Review GitHub's dependency diff without checking out the pull request.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
