apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-indexer-bootstrap
  namespace: opensearch
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-indexer-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/wazuh/wazuh-indexer:4.14.11@sha256:6855bea0a883fda201cba1b9969a744d01559bb4ee05aa4703b937edee0c11e5
          command: [python3, -B, /etc/wazuh-bootstrap/source/bootstrap.py]
          env:
            - name: OPENSEARCH_PATH_CONF
              value: /usr/share/wazuh-indexer/config
            - name: OPENSEARCH_JAVA_HOME
              value: /usr/share/wazuh-indexer/jdk
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-admin-password
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-admin-password
                  key: password
            - name: PROOF_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-proof-bootstrap
                  key: SEARCH_USERNAME
            - name: PROOF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-proof-bootstrap
                  key: SEARCH_PASSWORD
            - name: MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-manager-credentials
                  key: indexer-password
            - name: DASHBOARDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-dashboards-user
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /etc/wazuh-bootstrap/source
              readOnly: true
            - name: tls
              mountPath: /etc/wazuh-bootstrap/tls
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: wazuh-indexer-bootstrap
        - name: tls
          secret:
            secretName: wazuh-indexer-bootstrap-tls
            defaultMode: 0440
