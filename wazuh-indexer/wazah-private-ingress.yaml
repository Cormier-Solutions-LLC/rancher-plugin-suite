apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wazah-private
  namespace: wazah
spec:
  serverName: wazuh-dashboard.wazah.svc.cluster.local
  rootCAsSecrets:
    - wazuh-dashboard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wazah-private
  namespace: wazah
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`wazah.cormierconsulting.io`)
      middlewares:
        - name: private-networks
      services:
        - name: wazuh-dashboard
          port: 5601
          scheme: https
          serversTransport: wazah-private
  tls:
    secretName: wazah-private-ingress-tls
