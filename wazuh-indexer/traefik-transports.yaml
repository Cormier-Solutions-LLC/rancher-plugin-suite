apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wazuh-indexer
  namespace: wazah
spec:
  serverName: wazuh-indexer.wazah.svc.cluster.local
  rootCAsSecrets:
    - wazuh-indexer-node-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wazuh-indexer-dashboards
  namespace: wazah
spec:
  serverName: wazuh-indexer-dashboards.wazah.svc.cluster.local
  rootCAsSecrets:
    - wazuh-indexer-dashboards-tls
