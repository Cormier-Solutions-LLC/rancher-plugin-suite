apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opensearch-private-ingress
  namespace: wazah
spec:
  dnsNames:
  - opensearch.cormierconsulting.io
  - opensearch-api.cormierconsulting.io
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: opensearch-private-ingress-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opensearch-private
  namespace: wazah
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`opensearch.cormierconsulting.io`)
    middlewares:
    - name: private-networks
    services:
    - name: wazuh-indexer-dashboards
      port: 5601
      scheme: https
      serversTransport: wazuh-indexer-dashboards
  - kind: Rule
    match: Host(`opensearch-api.cormierconsulting.io`)
    middlewares:
    - name: private-networks
    services:
    - name: wazuh-indexer
      port: 9200
      scheme: https
      serversTransport: wazuh-indexer
  tls:
    secretName: opensearch-private-ingress-tls
