apiVersion: v1
kind: Service
metadata:
  name: kubernetes-ha
  namespace: default
spec:
  ports:
    - name: api
      port: 6443
      targetPort: 6443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kubernetes-ha
  namespace: default
  labels:
    kubernetes.io/service-name: kubernetes-ha
    endpointslice.kubernetes.io/managed-by: cormier-manager-suite
addressType: IPv4
ports:
  - name: api
    port: 6443
    protocol: TCP
endpoints:
  - addresses: [10.99.15.11]
    conditions: {ready: true}
  - addresses: [10.99.15.12]
    conditions: {ready: true}
  - addresses: [10.99.15.13]
    conditions: {ready: true}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: kubernetes-ha
  namespace: default
spec:
  entryPoints: [kubernetes]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: kubernetes-ha
          port: 6443
  tls:
    passthrough: true
