apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-windows-bridge
  namespace: dns-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dns-windows-bridge
  namespace: dns-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dns-windows-queue, dns-windows-observations]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dns-windows-bridge
  namespace: dns-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dns-windows-bridge
subjects:
  - kind: ServiceAccount
    name: dns-windows-bridge
    namespace: dns-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dns-windows-snapshot-reader
  namespace: manager-system
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["http:dns-manager-snapshots:8080"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dns-windows-snapshot-reader
  namespace: manager-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dns-windows-snapshot-reader
subjects:
  - kind: ServiceAccount
    name: dns-windows-bridge
    namespace: dns-system
---
apiVersion: v1
kind: Secret
metadata:
  name: dns-windows-bridge-credential
  namespace: dns-system
  annotations:
    kubernetes.io/service-account.name: dns-windows-bridge
type: kubernetes.io/service-account-token
