apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrent-access-gateway
  namespace: torrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: torrent-access-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: torrent-access-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: docker.io/library/node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
          command: [node, /gateway/gateway.mjs]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ACCESS_ISSUER, value: "https://access.cormierconsulting.io"}
            - {name: ACCESS_LICENSING_ORIGIN, value: "https://licensing.cormierconsulting.io"}
            - {name: ACCESS_PUBLIC_ORIGIN, value: "https://torrent.cormierconsulting.io"}
            - {name: QBITTORRENT_UPSTREAM, value: "http://torrent-webui-backend.torrent.svc.cluster.local:8090"}
            - {name: ACCESS_OWNER_FILE, value: /secrets/torrent-access/owner}
            - {name: ACCESS_CLIENT_SECRET_FILE, value: /secrets/torrent-access/client-secret}
            - {name: QBITTORRENT_PASSWORD_FILE, value: /secrets/torrent-access/backend-password}
          readinessProbe:
            httpGet: {path: /_access/health, port: http}
          livenessProbe:
            httpGet: {path: /_access/health, port: http}
          resources:
            requests: {cpu: 25m, memory: 40Mi}
            limits: {cpu: 300m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /gateway, readOnly: true}
            - {name: credentials, mountPath: /secrets/torrent-access, readOnly: true}
      volumes:
        - name: code
          configMap: {name: torrent-access-gateway}
        - name: credentials
          secret: {secretName: torrent-access-credentials, defaultMode: 288}
---
apiVersion: v1
kind: Service
metadata:
  name: torrent-access-gateway
  namespace: torrent
spec:
  selector:
    app.kubernetes.io/name: torrent-access-gateway
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: torrent-webui-backend
  namespace: torrent
spec:
  selector:
    app.kubernetes.io/name: torrent
  ports:
    - {name: webui, port: 8090, targetPort: webui, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: torrent-access-gateway
  namespace: torrent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: torrent-access-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik-system
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: torrent
      ports: [{protocol: TCP, port: 8090}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik-system
      ports: [{protocol: TCP, port: 8443}]
