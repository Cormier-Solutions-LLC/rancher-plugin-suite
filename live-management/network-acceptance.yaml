apiVersion: v1
kind: Namespace
metadata:
  name: manager-acceptance
  labels:
    app.kubernetes.io/part-of: manager-acceptance
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: protocol-fixture
  namespace: manager-acceptance
data:
  server.cjs: |
    const http=require('node:http'),net=require('node:net'),dgram=require('node:dgram'),crypto=require('node:crypto');
    const web=http.createServer((req,res)=>res.end('manager-acceptance-v1\n'));
    web.on('upgrade',(req,socket,head)=>{
      const key=req.headers['sec-websocket-key'];
      if(req.url!=='/websocket'||!key||req.headers['sec-websocket-version']!=='13'){socket.end('HTTP/1.1 400 Bad Request\r\n\r\n');return;}
      const accept=crypto.createHash('sha1').update(key+'258EAFA5-E914-47DA-95CA-C5AB0DC85B11').digest('base64');
      socket.write('HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: '+accept+'\r\n\r\n');
      let pending=head;
      const frame=(opcode,data)=>socket.write(Buffer.concat([Buffer.from([0x80|opcode,data.length]),data]));
      const consume=()=>{while(pending.length>=2){const opcode=pending[0]&15,size=pending[1]&127;if(!(pending[0]&128)||!(pending[1]&128)||size>=126){socket.destroy();return;}if(pending.length<size+6)return;const mask=pending.subarray(2,6),data=Buffer.from(pending.subarray(6,size+6));pending=pending.subarray(size+6);for(let i=0;i<size;i++)data[i]^=mask[i%4];if(opcode===8){frame(8,data);socket.end();return;}if(opcode===9)frame(10,data);else if(opcode===1||opcode===2)frame(opcode,data);}};
      socket.on('error',()=>{});socket.on('data',chunk=>{pending=Buffer.concat([pending,chunk]);consume();});consume();
    });
    web.listen(8080,'0.0.0.0');
    net.createServer(socket=>socket.pipe(socket)).listen(9001,'0.0.0.0');
    const udp=dgram.createSocket('udp4');udp.on('message',(data,remote)=>udp.send(data,remote.port,remote.address));udp.bind(9002,'0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protocol-fixture
  namespace: manager-acceptance
spec:
  replicas: 2
  selector:
    matchLabels: {app: protocol-fixture}
  template:
    metadata:
      labels: {app: protocol-fixture}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: protocol-fixture}
              topologyKey: topology.kubernetes.io/zone
      containers:
        - name: fixture
          image: node:24.20.0-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
          command: [node, /app/server.cjs]
          ports:
            - {name: http, containerPort: 8080}
            - {name: tcp-echo, containerPort: 9001}
            - {name: udp-echo, containerPort: 9002, protocol: UDP}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: protocol-fixture}
---
apiVersion: v1
kind: Service
metadata:
  name: protocol-fixture
  namespace: manager-acceptance
spec:
  selector: {app: protocol-fixture}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: tcp-echo, port: 9001, targetPort: tcp-echo}
    - {name: udp-echo, port: 9002, targetPort: udp-echo, protocol: UDP}
