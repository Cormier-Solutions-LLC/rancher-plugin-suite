apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: torrent-webui-access
  namespace: torrent
  labels:
    app.kubernetes.io/part-of: manager-installation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: torrent
  policyTypes: [Ingress]
  ingress:
    # Preserve existing unrestricted traffic to every other TCP port/protocol.
    - ports:
        - protocol: TCP
          port: 1
          endPort: 8089
        - protocol: TCP
          port: 8091
          endPort: 65535
        - protocol: UDP
        - protocol: SCTP
    - ports:
        - protocol: TCP
          port: 8090
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: torrent-access-gateway
