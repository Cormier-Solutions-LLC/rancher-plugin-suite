template:
  spec:
    containers:
    - command:
      - /home/runner/run.sh
      env:
      - name: DOCKER_HOST
        value: unix:///var/run/docker.sock
      - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
        value: '120'
      image: harbor.cormierconsulting.io/automation/arc-runner-linux@sha256:47487de25bed200195b2a718e1316959c2f0effe35a9fe25c96b8270c7005ef9
      name: runner
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: '1'
          memory: 2Gi
      volumeMounts:
      - mountPath: /home/runner/_work
        name: work
      - mountPath: /var/run
        name: dind-sock
