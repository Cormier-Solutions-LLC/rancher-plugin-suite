template:
  spec:
    containers:
    - command:
      - /home/runner/run.sh
      env:
      - name: DOCKER_HOST
        value: unix:///var/run/docker.sock
      - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
        value: '120'
      image: harbor.cormierconsulting.io/automation/arc-runner-linux@sha256:aff611469abff1f2b001dbfdca57610c4c2ff830a289f72c3e15e7ec697c60f1
      name: runner
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: '1'
          memory: 2Gi
      volumeMounts:
      - mountPath: /home/runner/_work
        name: work
      - mountPath: /var/run
        name: dind-sock
