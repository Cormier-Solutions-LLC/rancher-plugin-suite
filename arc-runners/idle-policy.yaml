apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-idle-policy
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-runner-idle-policy
  namespace: arc-runners
rules:
  - apiGroups: [actions.github.com]
    resources: [autoscalingrunnersets]
    resourceNames: [cormier-runners]
    verbs: [get, patch]
  - apiGroups: [actions.github.com]
    resources: [ephemeralrunners]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-idle-policy
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: arc-runner-idle-policy
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-runner-idle-policy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arc-runner-idle-policy
  namespace: arc-runners
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 45
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: arc-runner-idle-policy
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: idle-policy
              image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
              command: [python, -B, /opt/policy/idle-policy.py]
              env:
                - name: RUNNER_NAMESPACE
                  value: arc-runners
                - name: RUNNER_SET
                  value: cormier-runners
                - name: WARM_RUNNERS
                  value: '16'
                - name: IDLE_SECONDS
                  value: '3600'
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: policy
                  mountPath: /opt/policy
                  readOnly: true
          volumes:
            - name: policy
              configMap:
                name: arc-runner-idle-policy
