apiVersion: v1
kind: Pod
metadata:
  name: emby-migration
  namespace: emby
  labels:
    app.kubernetes.io/name: emby-migration
    app.kubernetes.io/part-of: emby
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 100990
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: restore
      image: emby/embyserver:4.9.3.0@sha256:338a17ad65a822f18d18574459046003a84d2fee82c2e234adf8645009238d0a
      command: [/bin/sh, -c, "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN, FOWNER, DAC_OVERRIDE]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: "1", memory: 512Mi}
      volumeMounts:
        - {name: config, mountPath: /config}
    - name: nas-check
      image: emby/embyserver:4.9.3.0@sha256:338a17ad65a822f18d18574459046003a84d2fee82c2e234adf8645009238d0a
      command: [/bin/sh, -c, "sleep 86400"]
      securityContext:
        runAsUser: 999
        runAsGroup: 990
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - {name: media, mountPath: /mnt/remote-other, readOnly: true}
    # LXC uid 999 normally maps to host/NFS uid 100999. Verify before export.
    - name: transfer
      image: emby/embyserver:4.9.3.0@sha256:338a17ad65a822f18d18574459046003a84d2fee82c2e234adf8645009238d0a
      command: [/bin/sh, -c, "sleep 86400"]
      securityContext:
        runAsUser: 100999
        runAsGroup: 100990
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: "1", memory: 512Mi}
      volumeMounts:
        - {name: config, mountPath: /config}
        - {name: media, mountPath: /mnt/remote-other, readOnly: true}
  volumes:
    - name: config
      persistentVolumeClaim: {claimName: emby-config}
    - name: media
      persistentVolumeClaim: {claimName: emby-media, readOnly: true}
