apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emby
  namespace: emby
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: emby-emby-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [emby.cormierconsulting.io]
      secretName: emby-tls
  rules:
    - host: emby.cormierconsulting.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emby
                port: {name: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: emby-https-redirect
  namespace: emby
spec:
  redirectScheme:
    scheme: https
    permanent: true
