fullnameOverride: opensearch-operator
nodeSelector:
  storage.cormierconsulting.io/opensearch-eligible: "true"
legacyAPI:
  enabled: false
manager:
  watchNamespace: opensearch
  image:
    tag: 3.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 350Mi
      ephemeral-storage: 100M
    limits:
      memory: 768Mi
      ephemeral-storage: 1G
