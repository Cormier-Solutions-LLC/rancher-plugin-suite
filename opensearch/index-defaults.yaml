apiVersion: opensearch.org/v1
kind: OpensearchIndexTemplate
metadata:
  name: application-defaults
  namespace: opensearch
spec:
  opensearchCluster:
    name: opensearch
  name: application-defaults
  indexPatterns:
    - app-*
    - documents-*
    - logs-*
    - events-*
    - traces-*
    - metrics-*
  priority: 10
  template:
    settings:
      number_of_shards: 4
      number_of_replicas: 1
      refresh_interval: 5s
