apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: opensearch
  namespace: opensearch
spec:
  general:
    serviceName: opensearch
    version: 3.9.0
    setVMMaxMapCount: true
    nodeAttributes:
      - name: zone
        nodeLabel: topology.kubernetes.io/zone
    additionalConfig:
      cluster.routing.allocation.awareness.attributes: zone
      cluster.routing.allocation.disk.watermark.low: "70%"
      cluster.routing.allocation.disk.watermark.high: "80%"
      cluster.routing.allocation.disk.watermark.flood_stage: "90%"
      action.destructive_requires_name: "true"
  bootstrap:
    diskSize: 1Gi
    storageClass: opensearch-longhorn-retain
    jvm: -Xms1g -Xmx1g
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 500M
      limits:
        memory: 2Gi
        ephemeral-storage: 2G
  initHelper:
    image: busybox:1.37.0
  security:
    config:
      securityConfigSecret:
        name: opensearch-security-config
    tls:
      transport:
        generate: true
        perNode: true
        rotateDaysBeforeExpiry: 30
        enableHotReload: true
      http:
        generate: true
        rotateDaysBeforeExpiry: 30
        enableHotReload: true
  dashboards:
    enable: true
    version: 3.9.0
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 500M
      limits:
        memory: 2Gi
        ephemeral-storage: 2G
    tls:
      enable: true
      generate: true
    additionalConfig:
      opensearch_security.cookie.secure: "true"
      opensearch.ssl.verificationMode: full
      opensearch.ssl.certificateAuthorities: '["/usr/share/opensearch-dashboards/certs/ca.crt"]'
  nodePools:
    - component: nodes
      replicas: 3
      diskSize: 30Gi
      roles:
        - cluster_manager
        - data
        - ingest
      jvm: -Xms4g -Xmx4g
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          ephemeral-storage: 2G
        limits:
          memory: 8Gi
          ephemeral-storage: 12G
      persistence:
        pvc:
          storageClass: opensearch-longhorn-retain
          accessModes:
            - ReadWriteOnce
      pdb:
        enable: true
        minAvailable: 2
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  opensearch.org/opensearch-nodepool: nodes
              topologyKey: topology.kubernetes.io/zone
