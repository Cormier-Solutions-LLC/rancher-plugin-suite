apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: simple-network-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: simple-network-manager
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  plugin:
    name: simple-network-manager
    version: {{ .Chart.AppVersion | quote }}
    endpoint: {{ required "Set plugin.endpoint to the published extension directory URL" .Values.plugin.endpoint | quote }}
    compressedEndpoint: {{ .Values.plugin.compressedEndpoint | quote }}
    noCache: {{ .Values.plugin.noCache }}
    noAuth: false
    metadata:
      {{- toYaml .Values.plugin.metadata | nindent 6 }}
