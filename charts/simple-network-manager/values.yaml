# URL of the published extension directory containing files.txt and plugin/.
# This must be reachable by Rancher's UI plugin operator.
plugin:
  endpoint: ""
  compressedEndpoint: ""
  noCache: false
  metadata:
    catalog.cattle.io/display-name: Network Manager
    catalog.cattle.io/rancher-version: ">= 2.15.0 < 2.16.0"
    catalog.cattle.io/ui-extensions-version: ">= 3.0.0 < 4.0.0"

# Separate release prerequisite; never bundles/installs a private UI copy.
commonUI:
  verifyInstalled: true
  namespace: cattle-ui-plugin-system
  name: rancher-common-ui
  versionRange: ">=1.0.0 <2.0.0"
