apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "public-edge.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "public-edge.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "public-edge.selector" . | nindent 8 }}
      annotations:
        checksum/policy: {{ include "public-edge.nginx" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "public-edge.selector" . | nindent 14 }}
      containers:
        - name: nginx
          image: {{ .Values.image }}
          command: [nginx]
          args: [-c, /config/nginx.conf, -g, "daemon off;"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
            - {name: health, containerPort: 8081}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /ready, port: health}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /ready, port: health}
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -ec, "nginx -c /config/nginx.conf -s quit; sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "public-edge.name" . }}-config
        - name: tls
          secret:
            secretName: {{ .Values.certificate.secretName }}
            optional: {{ not .Values.publicHosts }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
