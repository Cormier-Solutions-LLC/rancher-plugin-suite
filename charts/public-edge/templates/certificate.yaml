{{- if .Values.publicHosts }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "public-edge.name" . }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  issuerRef:
    name: {{ .Values.certificate.issuerName }}
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    {{- toYaml .Values.publicHosts | nindent 4 }}
{{- end }}
