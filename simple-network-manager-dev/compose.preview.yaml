services:
  preview:
    image: simple-network-manager-preview:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.preview
      additional_contexts:
        preview-data: ../preview-data
    ports:
      - "127.0.0.1:8088:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - snapshots:/var/lib/simple-network-manager/snapshots
volumes:
  snapshots:
